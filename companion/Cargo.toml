[package]
name = "counterlock-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Local companion that serves the Counterlock UI and exposes live Deadlock match data on localhost"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
sysinfo = "0.32"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
