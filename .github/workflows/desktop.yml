name: desktop

on:
  push:
    branches: [main]
    paths: ['src-tauri/**', 'companion/src/**', 'app/**', 'package*.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src-tauri/**', 'companion/src/**', 'app/**', 'package*.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build:companion-ui
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Linux installers
        if: runner.os == 'Linux'
        env:
          NO_STRIP: '1'
        run: npm run desktop:build -- --config src-tauri/tauri.ci.conf.json
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: counterlock-desktop-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
